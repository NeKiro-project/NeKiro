site_name: NeKiro RepoWiki
site_url: https://nekiro-project.github.io/NeKiro/
repo_url: https://github.com/NeKiro-project/NeKiro
repo_name: NeKiro-project/NeKiro
edit_uri: edit/main/
docs_dir: .repowiki-site

nav:
  - Overview: index.md
  - Platform:
      - Architecture: architecture/index.md
      - Platform lifecycle: architecture/lifecycle.md
  - Contracts: contracts/index.md
  - Operations: operations/index.md
  - Decisions: decisions/index.md
  - Repository map: repositories.md
  - Satellite documentation: satellites/index.md
  - Source documents:
      - Index: source-docs/index.md
      - Architecture:
          - Phase 1 Architecture: source-docs/architecture/phase-1-spec.md
          - Platform Direction: source-docs/architecture/platform-direction.md
      - Contracts:
          - Compatibility Policy: source-docs/contracts/compatibility.md
          - Trusted Publication v1: source-docs/contracts/trusted-publication-v1.md
      - Decisions:
          - ADR 0001: source-docs/decisions/0001-go-backend-stack.md
          - ADR 0002: source-docs/decisions/0002-invocation-result-transport-and-internal-api-direction.md
          - ADR 0003: source-docs/decisions/0003-runtime-agnostic-platform-boundary.md
          - ADR 0004 Catalog: source-docs/decisions/0004-catalog-persistence-and-consistency.md
          - ADR 0004 Trusted Publication: source-docs/decisions/0004-trusted-agent-publication.md
          - ADR 0005: source-docs/decisions/0005-minimal-workspace-installation-boundary.md
          - ADR 0006: source-docs/decisions/0006-invocation-runtime-trust-and-failure-policy.md
          - ADR 0007: source-docs/decisions/0007-router-agent-signed-credential.md
          - ADR 0008: source-docs/decisions/0008-standalone-a2a-transport-module.md
          - ADR 0009: source-docs/decisions/0009-core-repository-boundary.md
      - Usage:
          - Core development: source-docs/usage/core-development.md
          - Trusted publication operations: source-docs/usage/trusted-publication-operations.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 中文
          build: true
          nav:
            - 概览: index.md
            - 平台:
                - 架构与所有权: architecture/index.md
                - 平台生命周期: architecture/lifecycle.md
            - 契约: contracts/index.md
            - 运维: operations/index.md
            - 决策记录: decisions/index.md
            - 仓库地图: repositories.md
            - 卫星仓库文档: satellites/index.md
            - 源文档:
                - 索引: source-docs/index.md
                - Architecture:
                    - 第一阶段架构: source-docs/architecture/phase-1-spec.md
                    - 平台方向: source-docs/architecture/platform-direction.md
                - Contracts:
                    - 兼容性策略: source-docs/contracts/compatibility.md
                    - 受信发布 v1: source-docs/contracts/trusted-publication-v1.md
                - Decisions:
                    - ADR 0001: source-docs/decisions/0001-go-backend-stack.md
                    - ADR 0002: source-docs/decisions/0002-invocation-result-transport-and-internal-api-direction.md
                    - ADR 0003: source-docs/decisions/0003-runtime-agnostic-platform-boundary.md
                    - ADR 0004 Catalog: source-docs/decisions/0004-catalog-persistence-and-consistency.md
                    - ADR 0004 Trusted Publication: source-docs/decisions/0004-trusted-agent-publication.md
                    - ADR 0005: source-docs/decisions/0005-minimal-workspace-installation-boundary.md
                    - ADR 0006: source-docs/decisions/0006-invocation-runtime-trust-and-failure-policy.md
                    - ADR 0007: source-docs/decisions/0007-router-agent-signed-credential.md
                    - ADR 0008: source-docs/decisions/0008-standalone-a2a-transport-module.md
                    - ADR 0009: source-docs/decisions/0009-core-repository-boundary.md
                - Usage:
                    - Core development: source-docs/usage/core-development.md
                    - Trusted publication operations: source-docs/usage/trusted-publication-operations.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - search.suggest
    - search.share
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - mdx_truly_sane_lists

extra_css:
  - assets/stylesheets/extra.css
