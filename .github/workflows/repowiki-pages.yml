name: RepoWiki Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'repowiki/**'
      - 'scripts/build_repowiki.py'
      - '.github/workflows/repowiki-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'repowiki/**'
      - 'scripts/build_repowiki.py'
      - '.github/workflows/repowiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repowiki-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate RepoWiki sources
        run: |
          python3 scripts/build_repowiki.py --check
          python3 -m py_compile scripts/build_repowiki.py

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate RepoWiki sources
        run: python3 scripts/build_repowiki.py --check

      - name: Generate RepoWiki source
        run: python3 scripts/build_repowiki.py --output .repowiki-site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@e4ef22193c23ea849fc3fea6dbce69da1ee65b6d # v1.0.9
        with:
          source: ./.repowiki-site
          destination: ./_site
          token: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
