name: RepoWiki Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'repowiki/**'
      - 'repowiki-requirements.txt'
      - 'scripts/build_repowiki.py'
      - 'scripts/sync_repowiki_satellites.py'
      - '.github/workflows/repowiki-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'repowiki/**'
      - 'repowiki-requirements.txt'
      - 'scripts/build_repowiki.py'
      - 'scripts/sync_repowiki_satellites.py'
      - '.github/workflows/repowiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repowiki-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: repowiki-requirements.txt

      - name: Install RepoWiki dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement repowiki-requirements.txt

      - name: Generate and validate RepoWiki source
        run: |
          python scripts/build_repowiki.py --check
          python scripts/build_repowiki.py --output .repowiki-site
          python -m py_compile scripts/build_repowiki.py scripts/sync_repowiki_satellites.py

      - name: Build both locales
        run: |
          mkdocs build --strict --verbose --site-dir .mkdocs-check -f mkdocs.yml
          test -s .mkdocs-check/index.html
          test -s .mkdocs-check/zh/index.html

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: repowiki-requirements.txt

      - name: Install RepoWiki dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement repowiki-requirements.txt

      - name: Generate RepoWiki source
        run: python scripts/build_repowiki.py --output .repowiki-site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build MkDocs site
        run: mkdocs build --strict --verbose --site-dir ./site -f mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
